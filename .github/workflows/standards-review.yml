# .github/workflows/standards-review.yml
# Standards compliance review on pull requests (opted in via setup.sh --workflow).
# Jesinia keeps Python in server/ and TypeScript in web/, and the compliance checks only
# inspect the root they are given, so this runs the linter once per sub-project — the same
# thing `make lint-standards` does locally — instead of the composite action at repo root.
name: Standards Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  standards-review:
    name: Standards Review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the conventional-commits check
          submodules: true

      - name: Lint standards (server/, web/)
        run: make lint-standards
