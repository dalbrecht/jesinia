# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install
        run: make install

      - name: CI (Python, JS, standards; coverage gate >= 95%)
        run: make ci

      - name: Install Playwright Chromium
        run: cd web && pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: make test-e2e
