<style>
.crumb { display: flex; align-items: center; gap: 6px; white-space: nowrap; }

.loadpr { display: flex; gap: 6px; align-items: center; padding: var(--jx-space-2) var(--jx-space-3); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); }

.repos { align-content: start; } .repos .row { grid-template-columns: 1fr auto; }

.verdict { font-size: var(--jx-text-sm); font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }

.pill { font-size: var(--jx-text-xs); border: 1px solid var(--jx-border); border-radius: 999px; padding: 0 7px; background: var(--jx-surface); color: var(--jx-fg-muted); white-space: nowrap; }

.cov { font-variant-numeric: tabular-nums; }

figure { margin: 0 0 var(--jx-space-6); } figcaption { margin-top: var(--jx-space-2); color: var(--jx-fg-muted); font-size: var(--jx-text-sm); max-width: 900px; }

.wtabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px var(--jx-space-3) 0; background: var(--jx-surface-sunken); border-bottom: 1px solid var(--jx-border); }
.wtab { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--jx-radius-md) var(--jx-radius-md) 0 0; font-size: var(--jx-text-sm); color: var(--jx-fg-muted); max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.stabs { display: flex; gap: 4px; padding: var(--jx-space-3) var(--jx-space-3) 0; border-bottom: 1px solid var(--jx-border); }

.secintro { display: flex; align-items: center; gap: 12px; margin: var(--jx-space-3); padding: var(--jx-space-3) var(--jx-space-4); border: 1px solid var(--jx-border); border-left: 4px solid var(--jx-success); border-radius: var(--jx-radius-md); background: var(--jx-surface); font-size: var(--jx-text-sm); }
.secintro b { font-size: var(--jx-text-base); }
.secintro .sp { margin-left: auto; display: flex; gap: 6px; }
.cards { display: grid; gap: 8px; padding: 0 var(--jx-space-3) var(--jx-space-3); }
.cards .q { border: 1px solid var(--jx-border); border-radius: var(--jx-radius-md); background: var(--jx-surface); padding: 10px 12px; }
.cards .q.sel { border-color: var(--jx-app); box-shadow: 0 0 0 1px var(--jx-app); }
.mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 var(--jx-space-3) var(--jx-space-3); }
.mini div { border: 1px dashed var(--jx-border-strong); border-radius: var(--jx-radius-md); padding: 8px 10px; font-size: var(--jx-text-sm); color: var(--jx-fg-muted); }
.mini b { color: var(--jx-fg); }
.cols > .pane:last-child { display: grid; grid-template-rows: auto auto minmax(0, 1fr); align-content: start; }
.cols > .pane:last-child > .scroll { align-content: start; }

/* Review: wide diff + narrative column. Page-local layout only; all values are tokens. */
.crumb { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--jx-fg); font-weight: 500; }

.rv { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; height: 100%; }
.prbar { display: flex; align-items: center; gap: 12px; padding: var(--jx-space-2) var(--jx-space-4); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); min-width: 0; }
.prbar .tt { font-weight: 600; font-size: var(--jx-text-lg); font-variation-settings: "opsz" 48; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.prbar .sp { margin-left: auto; display: flex; gap: 6px; flex: none; }
.plus { color: var(--jx-success); } .minus { color: var(--jx-danger); }
.rv .tabs { background: var(--jx-surface); }
.tabs.scrollx { overflow-x: auto; flex-wrap: nowrap; }
.split { grid-template-columns: minmax(0, 3fr) 6px minmax(0, 2fr); }
.rightcol { display: grid; grid-template-rows: minmax(0, 1fr) 6px minmax(0, 1fr); min-height: 0; }

.fileh { display: flex; align-items: center; gap: 8px; padding: 6px var(--jx-space-3); font-family: var(--jx-font-mono); font-size: var(--jx-text-sm); background: var(--jx-surface); border-block: 1px solid var(--jx-border); position: sticky; top: 0; }
.fileh .sp { margin-left: auto; font-family: var(--jx-font-ui); color: var(--jx-fg-muted); }
.diff .hunk { white-space: normal; padding: 0; }
.diff .fileh { white-space: normal; padding: 6px var(--jx-space-3); }
.diff .hunk.cur { background: var(--jx-accent-subtle); }
.diff .hunk.cur .h { background: var(--jx-highlight); color: var(--jx-fg); }
.walk { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
.steph { display: flex; align-items: center; gap: 8px; padding: var(--jx-space-3) var(--jx-space-4) var(--jx-space-2); }
.steph .n { font-size: var(--jx-text-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--jx-fg-muted); font-weight: 600; }
.stepb { padding: 0 var(--jx-space-4) var(--jx-space-3); }
.stepb h3 { margin: 0 0 var(--jx-space-2); font-size: var(--jx-text-lg); font-weight: 600; font-variation-settings: "opsz" 48; }
.stepb p { font-family: var(--jx-font-read); font-size: var(--jx-text-read); line-height: var(--jx-leading-read); margin: 0 0 var(--jx-space-2); }
.stepnav { display: flex; align-items: center; gap: 6px; padding: var(--jx-space-2) var(--jx-space-4); border-top: 1px solid var(--jx-border); }
.stepnav .dots { display: flex; gap: 4px; margin-inline: auto; }
.stepnav .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--jx-border-strong); display: block; }
.stepnav .dots i.on { background: var(--jx-app); }
.repos .row { grid-template-columns: 1fr auto; }
.prrow .t { font-weight: var(--jx-weight-medium); }
.chg { color: var(--jx-warn); font-size: var(--jx-text-sm); }
.tabbody { padding: var(--jx-space-5) var(--jx-space-6); display: grid; gap: var(--jx-space-4); align-content: start; max-width: 860px; }
.tabbody h3 { margin: 0; font-size: var(--jx-text-lg); font-weight: 600; }

.frame.half .tabbody { padding: var(--jx-space-4); gap: var(--jx-space-3); }
.mtable { width: 100%; border-collapse: collapse; font-size: var(--jx-text-sm); }
.mtable th { text-align: left; font-size: var(--jx-text-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--jx-fg-muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--jx-border); }
.mtable td { padding: 8px; border-bottom: 1px solid var(--jx-border); vertical-align: top; }
.mtable td.c { font-weight: 500; white-space: nowrap; }
.mtable td.r { color: var(--jx-fg-muted); }
.score { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.bar { width: 80px; height: 6px; border-radius: 3px; background: var(--jx-surface-sunken); overflow: hidden; display: block; }
.bar > span { display: block; height: 100%; background: var(--jx-app); }
.quiz fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; }
.quiz legend { font-family: var(--jx-font-read); font-size: var(--jx-text-read-lg); line-height: var(--jx-leading-read-lg); font-weight: 600; margin-bottom: var(--jx-space-2); padding: 0; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: var(--jx-space-2) var(--jx-space-3); border: 1px solid var(--jx-border); border-radius: var(--jx-radius-md); background: var(--jx-surface); }
.opt input { margin-top: 4px; accent-color: var(--jx-accent); }
.opt.picked { border-color: var(--jx-accent); background: var(--jx-accent-subtle); }
.feedback { padding: var(--jx-space-2) var(--jx-space-3); background: var(--jx-success-bg); border-radius: var(--jx-radius-sm); font-size: var(--jx-text-sm); }
.feedback b { color: var(--jx-success); }

.rec { display: flex; align-items: center; gap: 10px; }

.reasons { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-family: var(--jx-font-read); font-size: var(--jx-text-read); line-height: var(--jx-leading-read); }
.advisory { border: 1px solid var(--jx-border-strong); border-radius: var(--jx-radius-md); padding: var(--jx-space-2) var(--jx-space-3); font-size: var(--jx-text-sm); color: var(--jx-fg-muted); background: var(--jx-surface-sunken); }
.advisory b { color: var(--jx-fg); font-weight: 500; }
.inline-err { border: 1px solid var(--jx-danger); background: var(--jx-danger-bg); border-radius: var(--jx-radius-md); padding: var(--jx-space-3); display: grid; gap: 8px; font-size: var(--jx-text-sm); }

.reflist li { display: flex; gap: 8px; align-items: baseline; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--jx-space-3); }
.toggle { display: flex; gap: 6px; padding: var(--jx-space-2) var(--jx-space-3); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); }
.sheet { position: absolute; inset: 64px 0 0 0; background: var(--jx-bg); border-radius: var(--jx-radius-lg) var(--jx-radius-lg) 0 0; box-shadow: var(--jx-shadow-2); z-index: 5; display: grid; grid-template-rows: auto 1fr; overflow: hidden; border-top: 1px solid var(--jx-border); }
.sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--jx-border-strong); margin: 6px auto; }
.frame.narrow .prbar { flex-wrap: wrap; gap: 4px 8px; padding: var(--jx-space-2) var(--jx-space-3); }
.frame.narrow .prbar .tt { font-size: var(--jx-text-base); white-space: normal; }
.frame.narrow .stepb, .frame.narrow .steph, .frame.narrow .stepnav { padding-inline: var(--jx-space-3); }
.frame.narrow .row .t { white-space: normal; }
.chatbtn { position: absolute; right: 12px; bottom: 12px; z-index: 3; box-shadow: var(--jx-shadow-2); }

.covbar { display: flex; align-items: center; gap: 10px; padding: 8px var(--jx-space-4); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); font-size: var(--jx-text-sm); }
.covbar .meter { width: 120px; height: 6px; border-radius: 3px; background: var(--jx-surface-sunken); overflow: hidden; }

.covbar .sp { margin-left: auto; display: flex; gap: 6px; }
.notwalked { margin: var(--jx-space-2) var(--jx-space-4) var(--jx-space-3); border: 1px dashed var(--jx-border-strong); border-radius: var(--jx-radius-md); padding: 8px 10px; font-size: var(--jx-text-sm); display: grid; gap: 4px; }
.notwalked .r { display: flex; gap: 8px; align-items: center; }

.notwalked .sp { margin-left: auto; }
.stabs2 { display: flex; gap: 2px; padding: 0 var(--jx-space-3); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); }
.stabs2 .stab { padding: 9px 14px; }
.ctx { display: block; font-size: var(--jx-text-xs); color: var(--jx-fg-muted); padding: 0 var(--jx-space-4) var(--jx-space-2); }
.chatdock { border-top: 1px solid var(--jx-border); padding: 8px var(--jx-space-4); display: flex; gap: 8px; align-items: center; font-size: var(--jx-text-sm); color: var(--jx-fg-muted); background: var(--jx-surface); }
.chatdock input { flex: 1; font: inherit; padding: 5px 8px; border: 1px solid var(--jx-border-strong); border-radius: var(--jx-radius-sm); background: var(--jx-bg); color: var(--jx-fg); }
.rvbody { display: grid; grid-template-rows: auto auto auto minmax(0,1fr); min-height: 0; height: 100%; }

.book { display: grid; grid-template-columns: 280px minmax(0,1fr); min-height: 0; height: 100%; }

.outline .oh { padding: var(--jx-space-3); border-bottom: 1px solid var(--jx-border); display: grid; gap: 4px; }
.outline .oh .t { font-weight: 600; }
.outline .oh .m { font-size: var(--jx-text-xs); color: var(--jx-fg-muted); }
.outline ol { list-style: none; margin: 0; padding: var(--jx-space-2) 0; overflow: auto; }
.outline .part { font-size: var(--jx-text-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--jx-fg-muted); font-weight: 600; padding: var(--jx-space-3) var(--jx-space-3) 4px; }
.outline li.e { display: grid; grid-template-columns: 16px 1fr auto; gap: 6px; align-items: baseline; padding: 5px var(--jx-space-3); font-size: var(--jx-text-sm); }
.outline li.e.sub { padding-left: 30px; }
.outline li.e.on { background: var(--jx-row-bg-selected); box-shadow: inset 3px 0 0 var(--jx-app); font-weight: 600; }
.outline li.e .st { color: var(--jx-fg-subtle); font-size: 11px; }
.outline li.e .st.done { color: var(--jx-success); }
.outline li.e .k { font-size: var(--jx-text-xs); color: var(--jx-fg-muted); white-space: nowrap; }
.outline li.e .k.bad { color: var(--jx-danger); }
.outline .of { border-top: 1px solid var(--jx-border); padding: var(--jx-space-3); font-size: var(--jx-text-sm); display: grid; gap: 6px; }
.view { display: grid; grid-template-rows: auto minmax(0,1fr) auto; min-height: 0; }
.vtool { display: flex; align-items: center; gap: 8px; padding: 6px var(--jx-space-3); border-bottom: 1px solid var(--jx-border); background: var(--jx-surface); font-size: var(--jx-text-sm); flex-wrap: wrap; }
.vtool .sep { width: 1px; height: 18px; background: var(--jx-border); }
.vtool .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.vtool .meter { width: 80px; height: 6px; border-radius: 3px; background: var(--jx-surface-sunken); overflow: hidden; display: inline-block; }
.vtool .meter span { display: block; height: 100%; width: 82%; background: var(--jx-app); }
.page { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); min-height: 0; }
.page .narr { overflow: auto; padding: var(--jx-space-5) var(--jx-space-5); border-right: 1px solid var(--jx-border); }
.page .narr h2 { margin: 0 0 var(--jx-space-2); font-size: var(--jx-text-xl); font-weight: 600; font-variation-settings: "opsz" 72; }
.page .narr p { font-family: var(--jx-font-read); font-size: var(--jx-text-read); line-height: var(--jx-leading-read); margin: 0 0 var(--jx-space-3); }
.vact { display: flex; align-items: center; gap: 8px; padding: var(--jx-space-2) var(--jx-space-3); border-top: 1px solid var(--jx-border); background: var(--jx-surface); }
.vact .sp { margin-left: auto; display: flex; gap: 6px; }
.btn.danger { border-color: var(--jx-danger); color: var(--jx-danger); }

.req { border: 1px solid var(--jx-border); border-radius: var(--jx-radius-md); padding: 10px 12px; margin-bottom: 10px; background: var(--jx-surface); display: grid; gap: 6px; font-size: var(--jx-text-sm); }
.req .st { font-weight: 600; }
.req .st.ok { color: var(--jx-success); } .req .st.part { color: var(--jx-warn); } .req .st.no { color: var(--jx-danger); }
.req .was { color: var(--jx-fg-muted); border-left: 3px solid var(--jx-border-strong); padding-left: 8px; font-style: italic; }
.prev { opacity: .75; border-left: 3px dashed var(--jx-border-strong); padding-left: 10px; font-size: var(--jx-text-sm); }
.modal { position: relative; margin: 30px auto; max-width: 720px; background: var(--jx-bg); border: 1px solid var(--jx-border-strong); border-radius: var(--jx-radius-lg); box-shadow: var(--jx-panel-raised-shadow); display: grid; grid-template-rows: auto minmax(0,1fr) auto; }
.modal .mh { padding: 12px 16px; border-bottom: 1px solid var(--jx-border); font-weight: 600; }

.modal .mf { padding: 10px 16px; border-top: 1px solid var(--jx-border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.warnbox { border: 1px solid var(--jx-warn); background: var(--jx-warn-bg); border-radius: var(--jx-radius-md); padding: 10px 12px; display: grid; gap: 6px; }
.warnbox b { color: var(--jx-warn); }
.cmt { border: 1px solid var(--jx-border); border-radius: var(--jx-radius-sm); padding: 8px 10px; background: var(--jx-surface); }
.cmt code { font-size: var(--jx-text-xs); }
